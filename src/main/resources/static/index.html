<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Pulse Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; }
        .alert-item { border-left: 5px solid #dc3545; }
        .nav-tabs { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Festival Pulse</h1>
            <div id="summary-stats" class="d-flex gap-3">
                <span class="badge bg-primary">Areas: <span id="stat-areas">0</span></span>
                <span class="badge bg-info">Reports: <span id="stat-reports">0</span></span>
                <span class="badge bg-danger">Active Alerts: <span id="stat-alerts">0</span></span>
            </div>
        </header>

        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-tabs">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button">Dashboard</button>
            </li>
            <li class="nav-tabs">
                <button class="nav-link" id="areas-tab" data-bs-toggle="tab" data-bs-target="#areas" type="button">Areas</button>
            </li>
            <li class="nav-tabs">
                <button class="nav-link" id="reports-tab" data-bs-toggle="tab" data-bs-target="#reports" type="button">Submit Report</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Dashboard Tab -->
            <div class="tab-pane fade show active" id="dashboard">
                <div class="row">
                    <div class="col-md-8">
                        <h3>Active Alerts</h3>
                        <div id="alerts-list">
                            <!-- Alerts will be loaded here -->
                        </div>
                        <h3 class="mt-4">Recent Crowd Reports</h3>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Area</th>
                                        <th>Level</th>
                                        <th>Note</th>
                                    </tr>
                                </thead>
                                <tbody id="reports-list">
                                    <!-- Reports will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <h3>Area Status</h3>
                        <div id="areas-summary-list">
                            <!-- Areas with their latest status could go here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Areas Tab -->
            <div class="tab-pane fade" id="areas">
                <div class="row">
                    <div class="col-md-6">
                        <h3>Create Festival Area</h3>
                        <form id="area-form">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" id="area-name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description / Location</label>
                                <textarea class="form-control" id="area-desc" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Type</label>
                                <select class="form-select" id="area-type">
                                    <option value="ENTERTAINMENT">Entertainment</option>
                                    <option value="FOOD_AND_DRINK">Food & Drink</option>
                                    <option value="WELFARE">Welfare</option>
                                    <option value="FACILITIES">Facilities</option>
                                    <option value="RETAIL">Retail</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Create Area</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <h3>Existing Areas</h3>
                        <ul class="list-group" id="all-areas-list">
                            <!-- Areas will be listed here -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Reports Tab -->
            <div class="tab-pane fade" id="reports">
                <div class="col-md-6">
                    <h3>Submit Crowd Report</h3>
                    <form id="report-form">
                        <div class="mb-3">
                            <label class="form-label">Festival Area</label>
                            <select class="form-select" id="report-area" required>
                                <!-- Areas will be populated here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Crowd Level</label>
                            <select class="form-select" id="report-level">
                                <option value="LOW">LOW</option>
                                <option value="MEDIUM">MEDIUM</option>
                                <option value="FULL">FULL</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Short Note</label>
                            <input type="text" class="form-control" id="report-note">
                        </div>
                        <button type="submit" class="btn btn-success">Submit Report</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
